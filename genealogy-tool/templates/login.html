{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 60px auto;">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
    <p style="text-align: center; color: var(--text-color); margin-bottom: 2rem; opacity: 0.8;">
        Sign in to continue your family history work
    </p>

    <form method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-gold); font-weight: 700;">Start Your Journey</a>
    </p>
</div>
{% endblock %}

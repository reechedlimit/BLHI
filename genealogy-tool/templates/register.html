{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 60px auto;">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Create Your Account</h2>
    <p style="text-align: center; color: var(--text-color); margin-bottom: 2rem; opacity: 0.8;">
        Join the Black Lineage & Heritage Institute community
    </p>

    <form method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Your full name">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="At least 6 chars" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat password">
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-gold); font-weight: 700;">Sign in instead</a>
    </p>
</div>
{% endblock %}

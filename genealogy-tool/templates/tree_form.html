{% extends "base.html" %}
{% block title %}{{ action }} Lineage{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 60px auto;">
    <h3>{{ action }} Family Lineage</h3>
    <p style="margin-bottom: 2rem; opacity: 0.8;">Give this lineage a name and a brief description to begin your documentation.</p>

    <form method="POST">
        <div class="form-group">
            <label for="name">Lineage Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g., The Johnson Family" value="{{ tree.name if tree else '' }}">
        </div>
        <div class="form-group">
            <label for="description">Summary (optional)</label>
            <textarea id="description" name="description" placeholder="A brief overview of this family line...">{{ tree.description if tree else '' }}</textarea>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">{{ action }} Lineage</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

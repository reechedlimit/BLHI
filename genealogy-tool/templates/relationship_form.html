{% extends "base.html" %}
{% block title %}Add Connection{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 60px auto;">
    <h3>🔗 Connect Your Ancestors</h3>
    <p style="margin-bottom: 2rem; opacity: 0.8;">
        Define the links that form the chain of your family history.
    </p>

    <form method="POST">
        <div class="form-group">
            <label for="person_1_id">First Person</label>
            <select id="person_1_id" name="person_1_id" required>
                <option value="">— Select —</option>
                {% for person in people %}
                    <option value="{{ person.id }}">{{ person.first_name }} {{ person.last_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="relationship_type">Type of Connection</label>
            <select id="relationship_type" name="relationship_type" required>
                <option value="spouse">Spouse / Partner</option>
                <option value="parent-child">Parent-Child</option>
                <option value="sibling">Sibling</option>
                <option value="other">Other Connection</option>
            </select>
        </div>

        <div class="form-group">
            <label for="person_2_id">Second Person</label>
            <select id="person_2_id" name="person_2_id" required>
                <option value="">— Select —</option>
                {% for person in people %}
                    <option value="{{ person.id }}">{{ person.first_name }} {{ person.last_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">Add Connection</button>
            <a href="{{ url_for('view_tree', tree_id=tree_id) }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 80px auto; text-align: center;">
    <div style="font-size: 8rem; font-family: var(--heading-font); color: var(--deep-burgundy); line-height: 1; margin-bottom: 1rem;">403</div>
    <h2 style="font-size: 2.2rem; margin-bottom: 1rem; color: var(--deep-brown);">Access Denied</h2>
    <p style="font-size: 1.1rem; color: var(--text-color); opacity: 0.8; margin-bottom: 2rem; max-width: 450px; margin-left: auto; margin-right: auto;">
        You don't have permission to access this page. Some doors are locked for a reason — 
        but if you believe this is an error, please reach out.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">← Go to Dashboard</a>
        <a href="{{ url_for('index') }}" class="btn btn-outline">Back to Home</a>
    </div>
</div>
{% endblock %}
